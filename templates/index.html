<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vulnerability Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- ================================
     GLOBAL PROGRESS BAR
================================ -->
<div id="globalProgressContainer" class="progress-container hidden">
    <div id="globalProgressBar" class="progress-bar">
        <span id="globalProgressPercent" class="progress-percent">0%</span>
    </div>
</div>

<p id="globalProgressStatus" class="progress-status hidden">Preparing scan...</p>


<!-- ================================
     MAIN SCANNER UI
================================ -->
<div class="container">

    <h1 class="title">Vulnerability Scanner</h1>
    <p class="subtitle">Scan any host for open ports, banners, CVEs, and misconfigurations.</p>

    <div class="card">

        <!-- Target -->
        <label class="label">Target IP / Domain</label>
        <input id="target" class="input" placeholder="e.g., 192.168.1.10">

        <!-- Scan Profile -->
        <label class="label">Scan Profile</label>
        <select id="profile" class="dropdown">
            <option value="quick">Quick</option>
            <option value="deep">Deep</option>
            <option value="oscp">Advanced</option>
            <option value="custom">Custom (enter port range)</option>
        </select>

        <!-- Custom Range -->
        <div id="rangeRow" class="range-row hidden">
            <label class="label">TCP Port Range</label>
            <div class="range">
                <input id="tcp_start" class="input small" value="1">
                <span class="range-sep">to</span>
                <input id="tcp_end" class="input small" value="1024">
            </div>
            <p class="hint">Only used when “Custom” is selected.</p>
        </div>

        <!-- Error Display -->
        <p id="error" class="error hidden"></p>

        <!-- Scan Button -->
        <button id="scanBtn" class="scan-btn">Start Scan</button>

    </div>

    <!-- RESULTS OUTPUT -->
    <div id="results"></div>

</div>

<script src="/static/script.js"></script>
</body>
</html>
