<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vulnerability Scanner</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <h1 class="title">Vulnerability Scanner</h1>
    <p class="subtitle">Scan a host for open ports, banners, CVEs, and misconfigurations.</p>

    <div class="card">
        <label for="target">Target IP / Domain</label>
        <input id="target" placeholder="e.g., 192.168.1.10">

        <label>TCP Port Range</label>
        <div class="range">
            <input id="tcp_start" value="1">
            <span>to</span>
            <input id="tcp_end" value="1024">
        </div>

        <button id="scanBtn">Start Scan</button>
        <p id="error" class="error hidden"></p>
    </div>

    <div id="loader" class="loader hidden"></div>

    <div id="results"></div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
